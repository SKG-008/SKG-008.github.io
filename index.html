<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual.Market - Property Listings</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- Header Banner Ad -->
    <div id="ad-header-banner" class="ad-slot"></div>
    
    <header class="fb-header">
        <div class="fb-header-content">
            <div class="header-main">
                <span class="fb-logo">Virtual.Market</span>
                <button id="mobileMenuBtn" class="mobile-menu-btn">☰</button>
            </div>
            
            <div class="desktop-nav">
                <a href="listing.html" id="addListingLink" class="nav-link">Add Listing</a>
                <a href="mylistings.html" id="myListingsLink" class="nav-link">My Listings</a>
                <a href="bookmarks.html" id="bookmarksLink" class="nav-link">Bookmarks</a>
                <form id="loginForm" class="fb-auth">
                    <input type="text" id="username" placeholder="Username" required />
                    <input type="password" id="password" placeholder="Password" required />
                    <button type="submit" id="loginBtn">Login</button>
                    <button type="button" id="registerBtn">Register</button>
                </form>
                <span id="displayUser" class="fb-user"></span>
                <a href="master.html" id="masterPageBtn" class="admin-link">Master Page</a>
                <a href="admin.html" id="adminPageBtn" class="admin-link">Admin</a>
                <a href="ad-admin.html" id="adAdminBtn" class="admin-link">Ads</a>
                <button id="logoutBtn" class="logout-btn">Logout</button>
            </div>
            
            <div id="mobileDropdown" class="mobile-dropdown">
                <div class="mobile-user-info">
                    <span id="mobileDisplayUser"></span>
                </div>
                <form id="mobileLoginForm" class="mobile-auth">
                    <input type="text" id="mobileUsername" placeholder="Username" required />
                    <input type="password" id="mobilePassword" placeholder="Password" required />
                    <button type="submit" id="mobileLoginBtn">Login</button>
                    <button type="button" id="mobileRegisterBtn">Register</button>
                </form>
                <div class="mobile-nav-links">
                    <a href="listing.html" id="mobileAddListingLink" class="mobile-nav-link">Add Listing</a>
                    <a href="mylistings.html" id="mobileMyListingsLink" class="mobile-nav-link">My Listings</a>
                    <a href="bookmarks.html" id="mobileBookmarksLink" class="mobile-nav-link">Bookmarks</a>
                    <a href="master.html" id="mobileMasterPageBtn" class="mobile-nav-link">Master Page</a>
                    <a href="admin.html" id="mobileAdminPageBtn" class="mobile-nav-link">Admin</a>
                    <a href="ad-admin.html" id="mobileAdAdminBtn" class="mobile-nav-link">Ads</a>
                    <button id="mobileLogoutBtn" class="mobile-logout-btn">Logout</button>
                </div>
            </div>
        </div>
    </header>
    <div class="listing-type-nav">
        <a href="index.html?sale" id="forSaleLink" class="listing-type-link">For Sale</a>
        <a href="index.html?rent" id="forRentLink" class="listing-type-link">For Rent</a>
    </div>
    <div class="container flex-container">
        <aside class="sidebar">
            <!-- Sidebar Top Ad -->
            <div id="ad-sidebar-top" class="ad-slot"></div>
            
            <h3>
                <button id="toggleFilterBtn" type="button">
                    Filter Listings &#9662;
                </button>
            </h3>
            <form id="filterForm" style="display:none;">
                <!-- Sale Filters -->
                <div id="saleFilters">
                    <label for="filterSaleSuburb">Suburb</label>
                    <input type="text" id="filterSaleSuburb" placeholder="e.g. Richmond">

                    <label for="filterSaleType">Property Type</label>
                    <select id="filterSaleType">
                        <option value="">Any</option>
                        <option value="House">House</option>
                        <option value="Apartment">Apartment</option>
                        <option value="Townhouse">Townhouse</option>
                        <option value="Unit">Unit</option>
                        <option value="Studio">Studio</option>
                    </select>

                    <label for="filterSaleMinPrice">Min Price</label>
                    <input type="number" id="filterSaleMinPrice" placeholder="Min Price">

                    <label for="filterSaleMaxPrice">Max Price</label>
                    <input type="number" id="filterSaleMaxPrice" placeholder="Max Price">

                    <label for="filterSaleBedrooms">Bedrooms</label>
                    <select id="filterSaleBedrooms">
                        <option value="">Any</option>
                        <option value="1">1+</option>
                        <option value="2">2+</option>
                        <option value="3">3+</option>
                        <option value="4">4+</option>
                        <option value="5">5+</option>
                    </select>

                    <label for="filterSaleBathrooms">Bathrooms</label>
                    <select id="filterSaleBathrooms">
                        <option value="">Any</option>
                        <option value="1">1+</option>
                        <option value="2">2+</option>
                        <option value="3">3+</option>
                    </select>
                </div>
                <!-- Rent Filters -->
                <div id="rentFilters">
                    <label for="filterRentSuburb">Suburb</label>
                    <input type="text" id="filterRentSuburb" placeholder="e.g. Richmond">

                    <label for="filterRentType">Property Type</label>
                    <select id="filterRentType">
                        <option value="">Any</option>
                        <option value="House">House</option>
                        <option value="Apartment">Apartment</option>
                        <option value="Townhouse">Townhouse</option>
                        <option value="Unit">Unit</option>
                        <option value="Studio">Studio</option>
                    </select>

                    <label for="filterRentMinPrice">Min Rent</label>
                    <input type="number" id="filterRentMinPrice" placeholder="Min Rent">

                    <label for="filterRentMaxPrice">Max Rent</label>
                    <input type="number" id="filterRentMaxPrice" placeholder="Max Rent">

                    <label for="filterRentBedrooms">Bedrooms</label>
                    <select id="filterRentBedrooms">
                        <option value="">Any</option>
                        <option value="1">1+</option>
                        <option value="2">2+</option>
                        <option value="3">3+</option>
                        <option value="4">4+</option>
                        <option value="5">5+</option>
                    </select>

                    <label for="filterRentBathrooms">Bathrooms</label>
                    <select id="filterRentBathrooms">
                        <option value="">Any</option>
                        <option value="1">1+</option>
                        <option value="2">2+</option>
                        <option value="3">3+</option>
                    </select>
                </div>
                <label for="searchInput">Keyword</label>
                <input type="text" id="searchInput" placeholder="e.g. pet friendly, pool">
                <button type="submit" class="filter-btn">Apply Filters</button>
            </form>
            
            <!-- Sidebar Bottom Ad -->
            <div id="ad-sidebar-bottom" class="ad-slot"></div>
        </aside>
        <main class="main-content">
            <!-- Content Top Ad -->
            <div id="ad-content-top" class="ad-slot"></div>
            
            <h2 id="listingsTitle">All Listings</h2>
            
            <!-- Content Middle Ad -->
            <div id="ad-content-middle" class="ad-slot"></div>
            
            <div id="listingsContainer"></div>
            
            <!-- Content Bottom Ad -->
            <div id="ad-content-bottom" class="ad-slot"></div>
        </main>
    </div>
    <script src="api.js"></script>
    <script src="imageUtils.js"></script>
    <script src="imageModal.js"></script>
    <script src="share.js"></script>
    <script src="ad-manager.js"></script>
    <script src="mobile-menu.js"></script>
    <script src="ui-enhancements.js"></script>
    <script src="script.js"></script>
</body>
</html>
