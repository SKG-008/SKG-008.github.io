<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiniPost - Master Admin</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="standardHeader" data-title="Master"></div>
    <div class="container">
        <button onclick="history.back()" style="background:#6c757d;color:white;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;margin-bottom:1rem;">← Back</button>
        <div id="masterLoginSection">
            <h2>Master Login</h2>
            <form id="masterLoginForm" style="display: flex; align-items: center; gap: 8px; margin: 0 0 24px 0;">
                <input type="text" id="masterUsername" placeholder="Username" required />
                <input type="password" id="masterPassword" placeholder="Password" required />
                <button type="submit">Login</button>
            </form>
        </div>
        <div id="masterContent" style="display:none;">
            <h2>All Listings (Admin Delete)</h2>
            <div id="allPostsContainer"></div>
            <h2>All User Credentials</h2>
            <div id="allUsersContainer"></div>
        </div>
        <a href="index.html">← Back to Home</a>
    </div>
    <script src="github-auto-sync.js"></script>
    <script src="api.js"></script>
    <script src="imageModal.js"></script>
    <script src="share.js"></script>
    <script src="header-template.js"></script>
    <script src="mobile-menu.js"></script>
    <script src="master.js"></script>
</body>
</html>
